  >
    <!-- Track 0: Dedicated full-bleed background clip -->
    <div
      id="04-share-poster-bg"
      class="clip"
      data-start="0"
      data-duration="6.5"
      data-track-index="0"
    ></div>

    <!-- Track 1: Broadside top hairline chrome -->
    <div
      id="04-share-poster-chrome"

    >

        <div id="04-share-poster-kicker">

  <script>
    (function () {
      var DURATION = 6.0;
      var tl = gsap.timeline({ paused: true });

      var chromeEl = document.getElementById("04-share-poster-chrome");
      var ruleStubEl = document.getElementById("04-share-poster-rule-stub");
      var kickerWords = [
        document.getElementById("04-share-poster-kw-0"),
        document.getElementById("04-share-poster-kw-1"),
        document.getElementById("04-share-poster-kw-2"),
      ];
      var headlineWords = [
        { el: document.getElementById("04-share-poster-hw-0"), text: "„als" },
        { el: document.getElementById("04-share-poster-hw-1"), text: "poster" },
        { el: document.getElementById("04-share-poster-hw-2"), text: "teilen.“" },
      ];
      var hero2Card = document.getElementById("04-share-poster-hero2-card");
      var shareCard = document.getElementById("04-share-poster-share-card");
      var specBadge = document.getElementById("04-share-poster-spec-badge");
      var pillsRule = document.getElementById("04-share-poster-pills-rule");
      var pillBar = document.getElementById("04-share-poster-pill-bar");
      var exportPills = [
        { el: document.getElementById("04-share-poster-pill-0"), text: "/ ALS BILD" },
        { el: document.getElementById("04-share-poster-pill-1"), text: "/ ALS TEXT" },
        { el: document.getElementById("04-share-poster-pill-2"), text: "/ GALERIE 1080×1080" },
      ];

      // Pre-compute content-length-aware stagger offsets ONCE at build time (dynamic-content-sequencing)
      var SEC_PER_CHAR_HEADLINE = 0.022;
      var headCursor = 0.14;
      var HEADLINE_SEQ = headlineWords.map(function (item) {
        var start = headCursor;
        headCursor += 0.09 + item.text.length * SEC_PER_CHAR_HEADLINE;
        return { el: item.el, start: start };
      });

      var SEC_PER_CHAR_PILL = 0.012;
      var pillCursor = 4.22;
      var PILL_SEQ = exportPills.map(function (item) {
        var start = pillCursor;
        pillCursor += 0.16 + item.text.length * SEC_PER_CHAR_PILL;
        return { el: item.el, start: start };
      });

      // --- SCENE 1 (0.0–1.8s): Dark register, kicker + headline stagger, screen-hero-2 anchored center-below ---
      tl.fromTo(
        chromeEl,
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
        0.0
      );

      tl.fromTo(
        ruleStubEl,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        0.04
      );

      kickerWords.forEach(function (kw, idx) {
        tl.fromTo(
          kw,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
          0.08 + idx * 0.07
        );
      });

      HEADLINE_SEQ.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          entry.start
        );
      });

      // screen-hero-2 visible well before t = 0.5s
      tl.fromTo(
        hero2Card,
        { opacity: 0, y: 36, scale: 0.94, x: 0 },
        { opacity: 1, y: 0, scale: 1.0, x: 0, duration: 0.48, ease: "power3.out" },
        0.02
      );

      // Subtle gated breath during Scene 1 hold (0.6s–1.75s)
      tl.to(
        hero2Card,
        { y: -8, duration: 0.58, ease: "sine.inOut" },
        0.6
      );
      tl.to(
        hero2Card,
        { y: 0, duration: 0.55, ease: "sine.inOut" },
        1.18
      );

      // Keep Scene 2 & Scene 3 elements cleanly parked before their triggers
      tl.set(shareCard, { opacity: 0, scale: 0.72, x: 48, y: 14 }, 0);
      tl.set(specBadge, { opacity: 0, x: 24, scaleX: 0.88 }, 0);
      tl.set(pillsRule, { scaleX: 0, opacity: 0 }, 0);
      tl.set(pillBar, { scaleX: 0 }, 0);
      PILL_SEQ.forEach(function (entry) {
        tl.set(entry.el, { opacity: 0, y: 22, scale: 0.95 }, 0);
      });

      // --- SCENE 2 (1.8–4.2s): Hero pivot aside + scale-swap-transition into screen-share-sheet.png (3 depth layers) ---
      var TRIGGER = 1.8;
      var EXIT_DUR = 0.45;
      var OVERLAP = 0.16;
      var ENTER_DUR = 0.62;
      var BOUNCE_FACTOR = 1.65;

      // Depth Layer 1: screen-hero-2 pivots left & recedes into background layer (power2.in)
      tl.to(
        hero2Card,
        {
          x: -225,
          y: 26,
          scale: 0.78,
          opacity: 0.34,
          duration: EXIT_DUR,
          ease: "power2.in",
        },
        TRIGGER
      );

      // Depth Layer 2: screen-share-sheet pops in as center hero via scale-swap-transition (back.out)
      tl.fromTo(
        shareCard,
        { scale: 0.72, opacity: 0, x: 48, y: 14 },
        {
          scale: 1.0,
          opacity: 1,
          x: 42,
          y: 0,
          duration: ENTER_DUR,
          ease: "back.out(" + BOUNCE_FACTOR + ")",
        },
        TRIGGER + EXIT_DUR - OVERLAP
      );

      // Depth Layer 3: Foreground 1080x1080 spec badge reveals after container settles (SUB_REVEAL_DELAY)
      tl.fromTo(
        specBadge,
        { opacity: 0, x: 24, scaleX: 0.88 },
        { opacity: 1, x: 0, scaleX: 1, duration: 0.4, ease: "power3.out" },
        TRIGGER + EXIT_DUR + 0.38
      );

      // Subtle gated settle breath on hero share sheet (3.1s–4.1s, lands crisp at poster 4.0s)
      tl.to(
        shareCard,
        { y: -5, duration: 0.48, ease: "sine.inOut" },
        3.1
      );
      tl.to(
        shareCard,
        { y: 0, duration: 0.42, ease: "sine.inOut" },
        3.58
      );

      // --- SCENE 3 (4.2–6.0s): Three crisp mono export pills stagger in and hold still ---
      tl.fromTo(
        pillsRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.05
      );

      PILL_SEQ.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 22, scale: 0.95 },
          { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "power3.out" },
          entry.start
        );
      });

      // Top accent bar snaps across primary export pill (/ ALS BILD)
      tl.fromTo(
        pillBar,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.34, ease: "power3.out" },
        4.38
      );

      // Full-duration anchor (no exit tween — non-final frame)
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-share-poster"] = tl;
      tl.seek(0);
    })();
  </script>
