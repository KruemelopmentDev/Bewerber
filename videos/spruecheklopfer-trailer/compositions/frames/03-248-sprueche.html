  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="03-248-sprueche"]');
      if (!root) return;

      const tl = gsap.timeline({ paused: true });

      const chrome = root.querySelector("#f03-248-sprueche-chrome");
      const stub = root.querySelector("#f03-248-sprueche-stub");
      const counter = root.querySelector("#f03-248-sprueche-counter");
      const counterSuffix = root.querySelector("#f03-248-sprueche-counter-suffix");
      const counterLabel = root.querySelector("#f03-248-sprueche-counter-label");
      const hairline = root.querySelector("#f03-248-sprueche-hairline");
      const tags = root.querySelectorAll(".f03-248-sprueche-tag");
      const screenCard = root.querySelector("#f03-248-sprueche-screen-card");
      const ruleFill = root.querySelector("#f03-248-sprueche-rule-fill");
      const footerRow = root.querySelector("#f03-248-sprueche-footer-row");

      // Scene 1 (0.0–1.8s): Top chrome + value-scaled count-up 0 -> 248 + suffix + mono label
      tl.fromTo(
        chrome,
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        0.0
      );

      tl.fromTo(
        stub,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power3.out" },
        0.05
      );

      const countState = { value: 0 };
      const COUNT_START = 0.05;
      const COUNT_DUR = 1.4;
      const START_SCALE = 0.52;

      tl.to(
        countState,
        {
          value: 248,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: () => {
            counter.textContent = String(Math.round(countState.value));
          },
        },
        COUNT_START
      );

      tl.fromTo(
        counter,
        { scale: START_SCALE, opacity: 0.2 },
        { scale: 1, opacity: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_START
      );

      // Label arrives before the count peaks (counting-dynamic-scale rule)
      tl.fromTo(
        counterLabel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        0.4
      );

      // Suffix "+" slides in AFTER the count completes
      tl.fromTo(
        counterSuffix,
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" },
        COUNT_START + COUNT_DUR
      );

      // Scene 2 (1.8–3.8s): Real screenshot spring-pop entrance + center-outward tag expansion
      tl.fromTo(
        screenCard,
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.68, ease: "power3.out" },
        1.8
      );

      tl.fromTo(
        hairline,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.92
      );

      tags.forEach((el, i) => {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          {
            xPercent: -50,
            yPercent: -50,
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 1.05,
            ease: "power3.out",
          },
          2.05 + i * 0.06
        );
      });

      // Scene 3 (3.8–5.0s): Full-width accent rule sweep (stat-bars-and-fills) + sharp hold
      tl.fromTo(
        ruleFill,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.85, ease: "power2.out" },
        3.8
      );

      tl.fromTo(
        footerRow,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        3.95
      );

      // Ensure full 5.0s timeline duration for seek determinism
      tl.set({}, {}, 5.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-248-sprueche"] = tl;
      tl.seek(0);
    })();
