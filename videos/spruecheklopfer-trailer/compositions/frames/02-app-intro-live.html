  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    (function () {
      const root =
        document.querySelector('[data-composition-id="02-app-intro-live"]') || document;
      const byId = (id) => root.querySelector('[id="' + id + '"]');

      const tl = gsap.timeline({ paused: true });

      // Ensure full 6.5s span is registered deterministically
      tl.to({}, { duration: 6.5 }, 0);

      // ============================================================
      // SCENE 1 (0.0–1.8s): Top kicker + app icon + dynamic-content-sequencing
      // per-word staggered reveal of "ein wort. ein tap."
      // ============================================================
      tl.fromTo(
        byId("02-app-intro-live-icon-wrap"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.04
      );

      tl.fromTo(
        byId("02-app-intro-live-stub"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        0.08
      );

      tl.fromTo(
        byId("02-app-intro-live-kicker"),
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        byId("02-app-intro-live-meta"),
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0.18
      );

      // Pre-compute content-length-driven word timeline ONCE at build time
      // (dynamic-content-sequencing rule)
      const WORDS = [
        { id: "02-app-intro-live-w0", text: "ein", hold: 0.12, meta: "01 / INPUT" },
        { id: "02-app-intro-live-w1", text: "wort.", hold: 0.18, meta: "02 / WORT" },
        { id: "02-app-intro-live-w2", text: "ein", hold: 0.12, meta: "03 / ACTION" },
        { id: "02-app-intro-live-w3", text: "tap.", hold: 0.22, meta: "LIVE UI" },
      ];

      const BASE_DUR = 0.12;
      const SEC_PER_CHAR = 0.04;
      let cursor = 0.08;
      const WORD_TIMELINE = WORDS.map((entry) => {
        const dur = BASE_DUR + entry.text.length * SEC_PER_CHAR + entry.hold;
        const start = cursor;
        cursor += dur;
        return { ...entry, start, end: cursor };
      });
      const SEQ_END = cursor;

      WORD_TIMELINE.forEach((entry) => {
        tl.fromTo(
          byId(entry.id),
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          entry.start
        );
      });

      function entryAt(time) {
        for (let i = WORD_TIMELINE.length - 1; i >= 0; i--) {
          if (time >= WORD_TIMELINE[i].start) return WORD_TIMELINE[i];
        }
        return WORD_TIMELINE[0];
      }

      const metaEl = byId("02-app-intro-live-meta");
      const seqFillEl = byId("02-app-intro-live-seq-fill");
      const seqDriver = { t: 0 };
      let lastMeta = "";

      tl.fromTo(
        seqFillEl,
        { scaleX: 0 },
        { scaleX: 1, duration: SEQ_END, ease: "none" },
        0
      );

      tl.to(
        seqDriver,
        {
          t: SEQ_END,
          duration: SEQ_END,
          ease: "none",
          onUpdate: () => {
            const active = entryAt(seqDriver.t);
            if (active.meta !== lastMeta) {
              metaEl.textContent = active.meta;
              lastMeta = active.meta;
            }
          },
        },
        0
      );

      // ============================================================
      // SCENE 2 (1.8–4.4s): Hero phone device spring-pop entrance
      // (spring-pop-entrance rule: smooth power3.out settle, no overshoot)
      // ============================================================
      tl.fromTo(
        byId("02-app-intro-live-device"),
        { scale: 0, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        1.8
      );

      // Step through real emulator recording frames on the beat
      tl.set(byId("02-app-intro-live-f1"), { opacity: 1 }, 0);
      tl.set([byId("02-app-intro-live-f2"), byId("02-app-intro-live-f3"), byId("02-app-intro-live-f4"), byId("02-app-intro-live-f5")], { opacity: 0 }, 0);
      tl.fromTo(byId("02-app-intro-live-f2"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 2.7);
      tl.fromTo(byId("02-app-intro-live-f3"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 3.6);
      tl.fromTo(byId("02-app-intro-live-f4"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 4.5);
      tl.fromTo(byId("02-app-intro-live-f5"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 5.4);

      // ============================================================
      // SCENE 3 (4.4–6.5s): Neon-emerald 1-TAP QUICK-CHIPS callout strip
      // + progress fill + growth bars (stat-bars-and-fills rule)
      // ============================================================
      tl.fromTo(
        byId("02-app-intro-live-pill"),
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.75, ease: "power2.out" },
        4.4
      );

      tl.fromTo(
        byId("02-app-intro-live-bar-fill"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.9, ease: "power2.out" },
        4.45
      );

      const vbars = root.querySelectorAll(".f-02-app-intro-live-vbar");
      tl.fromTo(
        vbars,
        { scaleY: 0 },
        { scaleY: 1, duration: 0.65, ease: "power3.out", stagger: 0.07 },
        4.55
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-app-intro-live"] = tl;
      tl.seek(0);
    })();
  </script>
