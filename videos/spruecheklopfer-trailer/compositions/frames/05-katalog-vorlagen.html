      var ACTIVE_RGB = { r: 221, g: 228, b: 221 }; // #DDE4DD
      var BRAND_RGB = { r: 40, g: 240, b: 120 };   // #28F078

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }

      function envelope(time, start, end, restLevel) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) {
          return 1 - ((time - end) / RELEASE) * (1 - restLevel);
        }
        return restLevel;
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            formulaWords.forEach(function (el) {
              var timing = TIMINGS[el.dataset.word];
              if (!timing) return;
              var isBrand = el.dataset.brand === "true";
              var restLevel = isBrand ? REST_LEVEL_BRAND : REST_LEVEL_NORMAL;
              var env = envelope(driver.t, timing.start, timing.end, restLevel);
              var target = isBrand ? BRAND_RGB : ACTIVE_RGB;
              var r = lerpChannel(REST_RGB.r, target.r, env);
              var g = lerpChannel(REST_RGB.g, target.g, env);
              var b = lerpChannel(REST_RGB.b, target.b, env);
              el.style.color = "rgb(" + r + ", " + g + ", " + b + ")";

              var maxBlur = isBrand ? MAX_BLUR_BRAND : MAX_BLUR_NORMAL;
              var glowAlpha = isBrand ? (0.85 * env).toFixed(3) : (0.25 * env).toFixed(3);
              var glowColor = isBrand
                ? "rgba(40, 240, 120, " + glowAlpha + ")"
                : "rgba(221, 228, 221, " + glowAlpha + ")";
              el.style.textShadow = "0 0 " + (maxBlur * env).toFixed(1) + "px " + glowColor;

              var maxScale = isBrand ? MAX_SCALE_BRAND : MAX_SCALE_NORMAL;
              el.style.transform = "scale(" + (1 + maxScale * env).toFixed(4) + ")";
            });
          },
        },
        0
      );

      // Full-span anchor (non-final frame — no exit tween)
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-katalog-vorlagen"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
