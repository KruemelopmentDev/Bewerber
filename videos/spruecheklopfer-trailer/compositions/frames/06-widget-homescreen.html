  <script>
    (function () {
      var DURATION = 5;
      var tl = gsap.timeline({ paused: true });

      var kickerWrap = document.getElementById("06-widget-homescreen-kicker-wrap");
      var line1 = document.getElementById("06-widget-homescreen-line-1");
      var line2 = document.getElementById("06-widget-homescreen-line-2");
      var card = document.getElementById("06-widget-homescreen-card");
      var subbarReveal = document.getElementById("06-widget-homescreen-subbar-label-reveal");
      var refreshBadge = document.getElementById("06-widget-homescreen-refresh-badge");
      var progressFill = document.getElementById("06-widget-homescreen-progress-fill");

      // Scene 1 (0.0 - 1.8s): spring-pop-entrance (long-tail power3.out, no overshoot)
      // Hero statement visible well before t <= 0.5s
      tl.fromTo(
        kickerWrap,
        { scale: 0.94, y: 18, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.08
      );

      tl.fromTo(
        line1,
        { scale: 0.94, y: 24, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        0.16
      );

      tl.fromTo(
        line2,
        { scale: 0.94, y: 24, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.78, ease: "power3.out" },
        0.3
      );

      // Scene 2 (1.8 - 3.6s): real widget-preview.png lands in 1px hairline card frame,
      // followed by stat-bars-and-fills wipe on the mono sub-bar + progress bar
      tl.fromTo(
        card,
        { scale: 0.94, y: 26, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        1.8
      );

      tl.fromTo(
        progressFill,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.9, ease: "power2.out" },
        2.25
      );

      tl.fromTo(
        subbarReveal,
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.85, ease: "power2.out" },
        2.25
      );

      tl.fromTo(
        refreshBadge,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.6
      );

      // Scene 3 (3.6 - 5.0s): deliberate calm hold; subtle low-amplitude sine-wave-loop
      // on the refresh icon badge only, with settle-and-fade tail before handoff
      var IDLE_START = 3.6;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 0.75;
      var Y_AMP_PX = 2;
      var SCALE_AMP = 0.012;
      var FADE_FRAC = 0.25;
      var phase = { p: 0 };

      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = phase.p / (Math.PI * 2 * CYCLES);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(phase.p) * env;
            gsap.set(refreshBadge, {
              y: s * Y_AMP_PX,
              scale: 1 + s * SCALE_AMP,
            });
          },
        },
        IDLE_START
      );

      // Full-span anchor so sub-composition timeline spans full 5.0s
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-widget-homescreen"] = tl;
      tl.seek(0);
    })();
